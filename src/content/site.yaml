# Global site settings: navigation, footer, offices, closing CTA, analytics.
name: Vigo
company: Vigo Projects Limited
email: hello@vigodigital.co
phone: "+44 (0) 203 576 3527"
tagline: Vigo is a digital product agency that digs deep into complex data, systems and user journeys to design digital products people actually want to use.

nav:
  - { label: Services, href: "/#services" }
  - { label: About, href: "/#about" }
  - { label: Insights, href: /insights }
  - { label: Get in Touch, href: /contact }

footerNav:
  - { label: Case Studies, href: "/#case-studies" }
  - { label: About, href: "/#about" }
  - { label: Contact, href: /contact }
  - { label: Services, href: "/#services" }

offices:
  - { city: London, address: "33 Foley Street, London W1W 7TL" }
  - { city: Manchester, address: "1 Market Street, Whaley Bridge, High Peak, Derbyshire SK23 7AA" }

# Closing call-to-action shown above the footer on every page.
cta:
  heading: Ready to discuss a project?
  body: Book an initial call to discuss how Vigo can work with you.
  label: Get in Touch
  href: /contact

# Share cards (the image shown when a page is shared on LinkedIn etc.) are generated
# automatically from each page's hero headline. Set text here for pages without one,
# or to override a page. Keys are page slugs ("home" for the homepage).
shareCards:
  contact:
    eyebrow: Contact Vigo
    headline: Tell us what you're working on. We normally reply within 24 hours.
  insights:
    eyebrow: Insights
    headline: Practical writing on digital product strategy, UX and enterprise platforms.
  case-studies:
    eyebrow: Case studies
    headline: Recent work, from legacy platform uplifts to clinical trials prototypes.

# Case studies shown as thumbnails in the header menu (slugs, in order).
menuCaseStudies: [benchmark_carbon, catchbox, anthony-ellis]

cookieMessage: We use cookies for analytics and marketing. No data is shared with third parties.

analytics:
  # Google Tag Manager — only loads after the visitor clicks "Accept All".
  gtm: GTM-WC36BZ5K

# Vigo's official profiles on other sites. Helps Google connect them to this site. Add LinkedIn etc. here.
sameAs:
  - https://clutch.co/profile/vigo

# Clutch review badge in the footer (remove to hide).
clutchCompanyId: "2156962"

# Extra badges shown beside the Clutch reviews badge in the footer. `href` is optional.
footerBadges:
  - src: /assets/badges/clutch-guarantee.svg
    alt: Clutch Guarantee

fontAwesomeKit: 55a5374d7e
