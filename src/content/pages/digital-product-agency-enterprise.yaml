  - type: faq
    heading: Your questions answered
    items:
      - q: What does an enterprise digital product agency do differently from a design agency?
        a: "A design agency usually handles one phase, such as a rebrand, a website or a set of wireframes, and hands over when it’s done. An enterprise digital product agency covers the full lifecycle: discovery, strategy, UX and UI design, front-end engineering and post-launch optimisation. The bigger difference is accountability. At enterprise scale you need a partner responsible for outcomes, who stays engaged when stakeholders disagree or the brief changes mid-programme."
      - q: Can you improve a legacy platform without rebuilding it?
        a: Yes. For Benchmark Estimating we modernised the visual design, data tables, dashboards and navigation in four weeks without changing the database, APIs or routing. Time on task fell 42% and 98% of users preferred the new interface.
      - q: How do you manage projects with many internal stakeholders?
        a: We plan for it rather than react to it. Discovery includes structured stakeholder interviews and alignment sessions that surface competing priorities before they block delivery. During the engagement we keep clear governance checkpoints, documented change requests and a regular reporting rhythm, so decision-makers stay informed without being pulled into day-to-day detail.
      - q: Can you work with our existing engineering team?
        a: Yes, and we often do. Benchmark kept their in-house developers. We typically lead discovery, product strategy and UX and UI design, and deliver component-based, documented designs that fit your build process. Where there’s a front-end gap, we embed a developer alongside your team.
      - q: How long does an enterprise engagement take?
        a: A UI uplift on an existing platform can take four weeks. Discovery and design for one product area typically runs 8 to 12 weeks, and a full platform rebuild 6 to 12 months. Multi-year programmes run on a rolling basis with phased milestones. If you have a fixed deadline or a phased budget, we shape the work around it from the start.
      - q: Do you have experience in regulated industries?
        a: Yes. Our work includes clinical trials software for Axivera and carbon reporting tools built around PAS 2080 for Benchmark. In these environments accessibility, documentation and data permissions are part of the brief, and compliance review is planned as its own stage.
      - q: How do you measure success after launch?
        a: We agree the measures in discovery, take a baseline from the current product and compare after launch. For Benchmark that meant time on task, clicks per core journey and user preference.
