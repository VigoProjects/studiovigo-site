  - type: prose
    body: |-
      We scope every engagement individually, but most fall into one of these shapes.

      -   **UI uplift on an existing platform:** around 4 weeks, with no architecture changes.
          
      -   **Discovery and design for one product area:** typically 8 to 12 weeks.
          
      -   **Full platform rebuild, discovery to launch:** typically 6 to 12 months.
          
      -   **Multi-year transformation:** rolling, with phased milestones and budgets.
          

      Read our guide to [enterprise MVP agency pricing](/insights/enterprise-mvp-agency-pricing)
