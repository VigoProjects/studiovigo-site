  - type: prose
    id: about
    eyebrow: What a digital product studio does
    body: |
      A digital product studio designs and builds the software people use every day: customer portals, SaaS platforms, internal tools and e-commerce journeys that need more than a marketing website. The work runs from research and strategy through interface design and front-end development, and carries on after launch.

      Vigo does all of that with a small senior team. Strategy, UX and UI design and front-end engineering sit together from day one, so the layouts we test are the layouts that get built, and the metrics we agree in discovery are the ones we report on after launch.
    image: { src: /assets/2025-11-06-17.14.23.jpg, alt: The Vigo team at work }

  - type: cards
    heading: From UX concept to post-launch measurement, under one roof
    items:
      - title: Discover and define
        body: Stakeholder interviews, user observation, journey mapping and agreed success metrics before any design starts. For [Catchbox](/case-studies/catchbox) we visited the factory in Latvia and interviewed staff, distributors and sales teams.
        icon: magnifying-glass
      - title: UX concept and page layouts
        body: "Wireframes, tested prototypes and production-ready Figma designs built on a component library. Example: two Catchbox wireframe concepts were tested against each other with users from broadcasting, AV and education."
        icon: table-layout
      - title: Build and launch
        body: Front-end development in React or Webflow, or design handed to your engineers with a developer embedded alongside them. For example, [benchmark's uplift shipped in four weeks](/case-studies/legacy-application-ui-uplift) without a single architecture change.
        icon: flag-pennant
      - title: Measure and optimise
        body: Analytics set-up, before-and-after benchmarks, UX audits and conversion work once real users arrive. Like [Benchmark's core journeys now take an average of 19.1 fewer clicks.](/case-studies/legacy-application-ui-uplift)
        icon: chart-column
    numbered: true

